[package]
name = "lcsm-slave"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-extra = { version = "0.10.3", features = ["query"] }
bytes = "1.12.1"
clap = { version = "4.5.53", features = ["derive"] }
futures = "0.3.33"
json-patch = "4.2.0"
sea-orm = { version = "2.0.0", features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-native-tls",
    "macros",
    "schema-sync",
    "entity-registry",
] }
serde = "1.0.229"
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "sync",
] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors", "auth", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
